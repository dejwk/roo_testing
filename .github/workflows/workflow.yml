name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BAZEL_SYMBOLIZE_FLAGS: >-
    --copt=-DHAVE_SYMBOLIZE
    --copt=-DHAVE_UNWIND
    --copt=-DHAVE_LIBUNWIND
    --linkopt=-lunwind
    --linkopt=-ldl

jobs:
  arduino:
    name: Arduino ${{ matrix.soc }}
    strategy:
      fail-fast: false
      matrix:
        soc: [esp32, esp32s3, esp32c3]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/ci-setup

    - name: Build
      run: |
        bazel build //:arduino_main //:arduino_gtest_main //:all_tests //examples/sntp/... \
          --config=roo_testing_arduino_${{ matrix.soc }} \
          ${{ env.BAZEL_SYMBOLIZE_FLAGS }}

    - name: Test
      run: |
        bazel test //:all_tests \
          //roo_testing/frameworks/esp32_shims:sntp_tests \
          //roo_testing/frameworks/esp32_shims:arduino_sntp_test \
          //roo_testing/frameworks/posix_time/... //examples/sntp/... \
          --config=roo_testing_arduino_${{ matrix.soc }} \
          --test_output=errors \
          ${{ env.BAZEL_SYMBOLIZE_FLAGS }}

  profile_contract:
    name: Frontend and wrapper contract
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/ci-setup

    - name: Verify Arduino, ESP-IDF, wrapper, and vendored profiles
      run: ./test/profile/verify_profile.sh

    - name: Build representative standalone examples
      env:
        ROO_TESTING_CHECKOUT: ${{ github.workspace }}
      run: |
        for example in simple gpio; do
          (
            cd "examples/${example}"
            bazel build :main \
              --override_module="roo_testing=${ROO_TESTING_CHECKOUT}"
          )
        done

  arduino_asan:
    name: Arduino ${{ matrix.soc }} (ASAN)
    strategy:
      fail-fast: false
      matrix:
        soc: [esp32, esp32s3, esp32c3]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/ci-setup

    - name: Build with address sanitizer
      run: |
        bazel build //:arduino_main //:arduino_gtest_main //:all_tests //examples/sntp/... \
          --config=roo_testing_arduino_${{ matrix.soc }} \
          --config=asan \
          ${{ env.BAZEL_SYMBOLIZE_FLAGS }}

    - name: Test with address sanitizer
      run: |
        bazel test //:all_tests \
          //roo_testing/frameworks/esp32_shims:sntp_tests \
          //roo_testing/frameworks/esp32_shims:arduino_sntp_test \
          //roo_testing/frameworks/posix_time/... //examples/sntp/... \
          --config=roo_testing_arduino_${{ matrix.soc }} \
          --config=asan \
          --test_output=errors \
          ${{ env.BAZEL_SYMBOLIZE_FLAGS }}

  idf_asan:
    name: ESP-IDF ${{ matrix.soc }} (ASAN)
    strategy:
      fail-fast: false
      matrix:
        soc: [esp32, esp32s3, esp32c3]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/ci-setup

    - name: Test ESP-IDF entry points with address sanitizer
      run: |
        bazel test :idf_tests \
          //roo_testing/frameworks/esp32_shims:sntp_tests \
          //roo_testing/frameworks/posix_time/... //examples/sntp/... \
          --config=roo_testing_idf_${{ matrix.soc }} \
          --config=asan \
          --test_output=errors \
          ${{ env.BAZEL_SYMBOLIZE_FLAGS }}

  idf:
    name: ESP-IDF ${{ matrix.soc }}
    strategy:
      fail-fast: false
      matrix:
        soc: [esp32, esp32s3, esp32c3]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/ci-setup

    - name: Test ESP-IDF entry points in normal builds
      run: |
        bazel test :idf_tests \
          //roo_testing/frameworks/esp32_shims:sntp_tests \
          //roo_testing/frameworks/posix_time/... //examples/sntp/... \
          --config=roo_testing_idf_${{ matrix.soc }} \
          --test_output=errors \
          ${{ env.BAZEL_SYMBOLIZE_FLAGS }}

  pico:
    name: Pico ${{ matrix.frontend }} ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        frontend: [pico, arduino]
        mode: [normal, asan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/ci-setup
    - name: Test native Pico frontend
      env:
        FRONTEND: ${{ matrix.frontend }}
        MODE: ${{ matrix.mode }}
      run: |
        options=()
        if [[ "$MODE" == asan ]]; then options+=(--config=asan); fi
        suite=pico_tests
        if [[ "$FRONTEND" == arduino ]]; then suite=arduino_pico_tests; fi
        bazel test "//:$suite" "--config=roo_testing_${FRONTEND}_rp2040" \
          "${options[@]}" --test_output=errors
