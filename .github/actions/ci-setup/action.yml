name: CI setup

description: Common CI setup steps for Bazel builds.

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Install system development dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-dev \
          libjpeg-dev \
          libpng-dev \
          libunwind-dev \
          libx11-dev \
          zlib1g-dev

    # The release tag is annotated, so this pins its peeled commit.
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
      with:
        # Keep wrapper behavior reproducible as well as the Bazel version in
        # the repository's .bazelversion file.
        bazelisk-version: 1.29.0
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per job to avoid concurrent writes.
        disk-cache: ${{ github.workflow }}-${{ github.job }}
        # Share repository cache between workflows.
        repository-cache: true
        # Pull requests may restore trusted caches but must not publish them.
        cache-save: ${{ github.event_name != 'pull_request' }}
